<title>Aldi Ehrfürchtig Buildschmiede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/*
  BUILDSCHMIEDE TOKEN BLOCK — share with synergien-source.html
  Own forge-slate chrome (CSS only). No Ascension/WoW BLP frame kits.
  Dark = default. Light = parchment reading mode.
  --ground --raised --sunken  stone panel stack
  --ink --ink-soft --ink-faint  text
  --rule --rule-soft --edge  metal lines
  --accent --accent-ink --accent-soft  guild gold (#C9A227 family)
  --ember --ember-soft  Wildcard heat (= --warn)
  --good --good-soft  live / ok
  --q0…--q4  WoW quality (Normal→Legendary) — data colors, not UI art
  --atm-a --atm-b  forge washes
  Spell/item icons: sprite / D.iic only (assemble), never UI chrome.
*/

:root{
  --ground:#D8D2C4; --raised:#EDE6D6; --sunken:#C9C1B0;
  --ink:#1A1510; --ink-soft:#3F362C; --ink-faint:#5C5244;
  --rule:#8A7E68; --rule-soft:#B0A48E;
  --accent:#8B6914; --accent-ink:#FFF8E0; --accent-soft:#E8D9A8;
  --ember:#B84A12; --ember-soft:#F0DCC8;
  --warn:var(--ember); --warn-soft:var(--ember-soft);
  --good:#2D6B3A; --good-soft:#D4E8D0;
  --q0:#9D9D9D; --q1:#1EFF00; --q2:#0070DD; --q3:#A335EE; --q4:#FF8000;
  --atm-a:rgba(139,105,20,.12); --atm-b:rgba(184,74,18,.06);
  --edge:rgba(26,21,16,.12);
  --panel-glow:rgba(139,105,20,.08);
  --stone:#2A241C; --gold:#C9A227; --gold-hi:#E8C547;
  --dur-view:.22s; --dur-chip:.15s; --ease-out:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0908; --raised:#1A1612; --sunken:#0D0B09;
  --ink:#E8E0D0; --ink-soft:#C4BAA6; --ink-faint:#A39886;
  --rule:#3A3428; --rule-soft:#2A241C;
  --accent:#C9A227; --accent-ink:#1A1408; --accent-soft:#2E2610;
  --ember:#FF8000; --ember-soft:#2A1608;
  --warn:var(--ember); --warn-soft:var(--ember-soft);
  --good:#1EFF00; --good-soft:#0A2010;
  --q0:#9D9D9D; --q1:#1EFF00; --q2:#0070DD; --q3:#A335EE; --q4:#FF8000;
  --atm-a:rgba(201,162,39,.10); --atm-b:rgba(255,128,0,.06);
  --edge:rgba(0,0,0,.45);
  --panel-glow:rgba(201,162,39,.06);
  --stone:#1A1612; --gold:#C9A227; --gold-hi:#E8C547;
}}
:root[data-theme="dark"]{
  --ground:#0A0908; --raised:#1A1612; --sunken:#0D0B09;
  --ink:#E8E0D0; --ink-soft:#C4BAA6; --ink-faint:#A39886;
  --rule:#3A3428; --rule-soft:#2A241C;
  --accent:#C9A227; --accent-ink:#1A1408; --accent-soft:#2E2610;
  --ember:#FF8000; --ember-soft:#2A1608;
  --warn:var(--ember); --warn-soft:var(--ember-soft);
  --good:#1EFF00; --good-soft:#0A2010;
  --q0:#9D9D9D; --q1:#1EFF00; --q2:#0070DD; --q3:#A335EE; --q4:#FF8000;
  --atm-a:rgba(201,162,39,.10); --atm-b:rgba(255,128,0,.06);
  --edge:rgba(0,0,0,.45);
  --panel-glow:rgba(201,162,39,.06);
  --stone:#1A1612; --gold:#C9A227; --gold-hi:#E8C547;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);min-height:100vh;
  font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.55;
  background-color:var(--ground);
  background-image:
    radial-gradient(ellipse 95% 60% at 6% -12%,var(--atm-a),transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 0%,var(--atm-b),transparent 48%),
    repeating-linear-gradient(-14deg,transparent,transparent 12px,rgba(18,21,31,.016) 12px,rgba(18,21,31,.016) 13px);
  background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{
  background-image:
    radial-gradient(ellipse 95% 60% at 6% -12%,var(--atm-a),transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 0%,var(--atm-b),transparent 48%),
    repeating-linear-gradient(-14deg,transparent,transparent 12px,rgba(255,255,255,.02) 12px,rgba(255,255,255,.02) 13px)}}
:root[data-theme="dark"] body{background-image:
  radial-gradient(ellipse 95% 60% at 6% -12%,var(--atm-a),transparent 55%),
  radial-gradient(ellipse 70% 50% at 100% 0%,var(--atm-b),transparent 48%),
  repeating-linear-gradient(-14deg,transparent,transparent 12px,rgba(255,255,255,.02) 12px,rgba(255,255,255,.02) 13px)}
h1,h2,h3{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;margin:0;text-wrap:balance;line-height:1.12}
.mono,code,button,input,select,.meta,.cnt,th{font-family:"JetBrains Mono",ui-monospace,monospace}

.panel{background:var(--raised);border:1px solid var(--rule);
  box-shadow:0 1px 0 var(--edge),0 0 0 1px var(--panel-glow)}
.panel-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--sunken);
  position:relative}
.panel-hd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--ember));opacity:.85}
.panel-hd h2{font-size:13px;letter-spacing:.055em}
.cnt{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt.ok{color:var(--good)} .cnt.full{color:var(--accent)} .cnt.over{color:var(--warn)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule-soft)}
input[type=search],select{background:var(--ground);color:var(--ink);border:1px solid var(--rule);
  padding:8px 10px;font-size:13px;border-radius:0}
input[type=search]{flex:1 1 190px;min-width:0}
.controls>select{flex:0 1 auto;min-width:8.5em;max-width:100%}
.filtmore{flex:0 0 auto;position:relative}
.filtmore>summary{list-style:none;cursor:pointer;font-family:"JetBrains Mono",monospace;
  font-size:12px;padding:7px 12px;border:1px solid var(--rule);background:var(--sunken);
  color:var(--ink-soft);user-select:none}
.filtmore>summary::-webkit-details-marker{display:none}
.filtmore>summary::after{content:" +";color:var(--ink-faint)}
.filtmore[open]{flex:1 1 100%}
.filtmore[open]>summary,.filtmore.active>summary{border-color:var(--accent);color:var(--accent)}
.filtmore[open]>summary::after{content:" −"}
.filtmore-n{margin-left:6px;font-size:10px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums}
.filtmore-in{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;align-items:center}
.filtmore-in>select{flex:1 1 140px;min-width:9em}
.filtreset{flex:0 0 auto;padding:7px 11px;font-size:12px;color:var(--ink-soft)}
.filtreset:hover{color:var(--ember);border-color:var(--ember)}
button{background:var(--sunken);color:var(--ink);border:1px solid var(--rule);
  padding:7px 12px;font-size:12px;cursor:pointer;border-radius:0;transition:border-color .15s,color .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.list{max-height:520px;overflow-y:auto}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;
  border-bottom:1px solid var(--rule-soft);cursor:pointer}
.row:hover{background:var(--sunken)}
.row.picked{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .body{flex:1;min-width:0}
.row .nm{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;
  letter-spacing:-.01em;color:var(--ink)}
.row .nm.q0,.slot .nm.q0,.nm.q0{color:var(--ink-soft)}
.row .nm.q1,.slot .nm.q1,.nm.q1{color:#7CFF66}
.row .nm.q2,.slot .nm.q2,.nm.q2{color:#6BB0FF}
.row .nm.q3,.slot .nm.q3,.nm.q3{color:#D4A0FF}
.row .nm.q4,.slot .nm.q4,.nm.q4{color:#FFB04A}
.row .ds{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{font-size:10px;color:var(--ink-faint);white-space:nowrap;padding-top:3px;
  font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;flex:0 0 8px;margin-top:6px;border-radius:50%}
.slot{display:flex;justify-content:space-between;gap:8px;padding:6px 14px;
  border-bottom:1px solid var(--rule-soft);font-size:13px;align-items:center}
.slot .nm{font-family:"JetBrains Mono",monospace;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink);font-weight:600}
.slot button[data-rm],.slot .rm{
  flex:0 0 auto;min-width:32px;min-height:28px;padding:4px 10px;
  font-size:16px;line-height:1;color:var(--ember);border-color:var(--rule);
  background:var(--sunken);background-image:none}
.slot button[data-rm]:hover,.slot .rm:hover,.slot button[data-rm]:active,.slot .rm:active{
  border-color:var(--ember);color:var(--ember);background:var(--ember-soft);
  background-image:none;filter:none}
.empty{padding:24px 16px;color:var(--ink-faint);font-size:13px;text-align:center}
.flag{padding:11px 16px;border-bottom:1px solid var(--rule-soft);font-size:13px}
.flag.dup{background:var(--warn-soft);border-left:4px solid var(--warn)}
.flag.syn{background:var(--good-soft);border-left:4px solid var(--good)}
.flag.pre{background:var(--warn-soft);border-left:4px solid var(--warn)}
.flag b{font-family:"JetBrains Mono",monospace;font-size:12px}
.share{padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px}
.share input{flex:1 1 100%;font-size:11px;font-family:"JetBrains Mono",monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--accent);color:var(--accent-ink);padding:11px 18px;font-size:13px;
  font-family:"JetBrains Mono",monospace;opacity:0;pointer-events:none;transition:opacity .2s;
  border:1px solid var(--accent);box-shadow:0 1px 0 var(--edge)}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}button{transition:none}}
:focus-visible{outline:2px solid var(--gold,var(--accent));outline-offset:2px}
.vtab:focus-visible,.tab:focus-visible,.slink:focus-visible,
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--gold,var(--accent));outline-offset:2px}
.skip{position:absolute;left:12px;top:0;z-index:200;transform:translateY(-120%);
  background:var(--accent);color:var(--accent-ink);padding:10px 14px;
  font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;
  text-decoration:none;border:1px solid var(--gold,var(--accent));
  transition:transform .15s}
.skip:focus,.skip:focus-visible{transform:translateY(12px);outline-offset:3px}
footer p{max-width:74ch}

/* Erste Schritte — Einstieg für Levelrun */
.startrow{border-bottom:1px solid var(--rule-soft);background:var(--accent-soft)}
.startin{max-width:1600px;margin:0 auto;padding:10px clamp(12px,2.4vw,28px);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px}
.startin .shd{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;
  letter-spacing:.04em;color:var(--accent);margin:0;flex:0 0 auto}
.startin p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.45;flex:1 1 220px;
  max-width:62ch}
.startin .slinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.startin a{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
  color:var(--accent);text-decoration:none;border:1px solid var(--accent);
  background:var(--raised);padding:6px 11px;white-space:nowrap}
.startin a:hover{background:var(--accent);color:var(--accent-ink)}
.startin a:focus-visible{outline-offset:2px}

/* ============ Kopfbalken ============ */
.topbar{position:sticky;top:0;z-index:50;background:var(--raised);
  border-bottom:1px solid var(--rule)}
.topbar::after{content:"";display:block;height:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 28%,transparent 62%)}
.tbin{max-width:1600px;margin:0 auto;padding:0 clamp(12px,2.4vw,28px);
  display:flex;align-items:center;gap:clamp(12px,2vw,28px);flex-wrap:wrap;
  min-height:68px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0}
.bmark{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-family:"Archivo Black",sans-serif;
  font-size:14px;letter-spacing:.02em}
.btext{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.btext .bguild{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
.btext b{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(18px,2.6vw,22px);
  font-weight:400;letter-spacing:-.02em}
.btext i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  letter-spacing:.07em;color:var(--ink-faint);margin-top:3px}

.statusrow{border-bottom:1px solid var(--rule-soft);background:color-mix(in srgb,var(--sunken) 55%,var(--raised))}
@supports not (background:color-mix(in srgb,white 50%,black)){.statusrow{background:var(--sunken)}}
.statusin{max-width:1600px;margin:0 auto;padding:7px clamp(12px,2.4vw,28px);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 auto;min-width:0}
.chip{font-family:"JetBrains Mono",monospace;font-size:11px;
  border:1px solid var(--rule);background:var(--sunken);padding:5px 10px;
  color:var(--ink-soft);white-space:nowrap;letter-spacing:.01em}
.chip.num{display:flex;align-items:baseline;gap:6px;padding:4px 10px}
.chip.num i{font-style:normal;font-size:8.5px;letter-spacing:.1em;
  color:var(--ink-faint)}
.chip.num b{font-variant-numeric:tabular-nums;color:var(--gold-hi);font-weight:700}
.chip.set{border-color:var(--gold);color:var(--gold-hi);background:var(--accent-soft)}
.chip.warnable.bad{border-color:var(--ember);background:var(--ember-soft)}
.chip.warnable.bad b{color:var(--ember)}
a.chip-go{text-decoration:none;color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft);font-weight:700}
a.chip-go:hover{background:var(--accent);color:var(--accent-ink)}
a.chip-go[hidden]{display:none}
.statushint{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.4;
  flex:1 1 200px;max-width:42ch}
.statushint a{color:var(--accent);font-weight:700;text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.statushint a:hover{border-bottom-color:var(--accent)}
.statushint code{font-size:11px;background:var(--raised);border:1px solid var(--rule);
  padding:1px 5px}
.statushint[hidden]{display:none}
.empty a{color:var(--accent);font-weight:700;text-decoration:none}
.empty a:hover{border-bottom:1px solid var(--accent)}
.empty code{font-size:11.5px;background:var(--sunken);border:1px solid var(--rule);
  padding:1px 5px}

.views{display:flex;gap:0;flex:0 0 auto;margin-left:auto}
.vtab{background:none;border:0;border-bottom:2px solid transparent;
  padding:22px 13px;font-family:"JetBrains Mono",monospace;font-size:12px;
  font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;
  align-items:center;gap:5px;letter-spacing:.01em;
  transition:color .15s,border-color .15s}
.vtab:hover{color:var(--ink)}
.vtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.vtab .cnt{font-size:10px;font-weight:400}
a.vtab{text-decoration:none;color:var(--ink-soft)}
a.vtab:hover{color:var(--ink)}
.slink{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
  color:var(--accent);text-decoration:none;border:1px solid var(--accent);
  background:var(--accent-soft);padding:8px 14px;white-space:nowrap;
  transition:background var(--dur-chip, .15s),color var(--dur-chip, .15s)}
.slink:hover{background:var(--accent);color:var(--accent-ink)}
@media(prefers-reduced-motion:reduce){.vtab,.slink{transition:none}}

/* ============ Ansichten ============ */
.wrap{max-width:1600px;margin:0 auto;padding:20px clamp(12px,2.4vw,28px) 0}
.view{display:none}
.view.on{display:block}

.cols{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}
@media(min-width:1100px){
  .cols-build{grid-template-columns:minmax(0,1fr) minmax(340px,420px)}
  .col-side{position:sticky;top:78px}
}
.col-side{display:grid;gap:18px;align-content:start}
.col-main .list{max-height:calc(100vh - 270px);min-height:340px}

.cards{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:1400px){
  .cards{grid-template-columns:1fr 1fr 1fr}
  .card-wide{grid-column:span 2}
}
@media(min-width:900px) and (max-width:1399px){.card-wide{grid-column:span 2}}

/* Auswertung: Befund zuerst, Rest sekundär */
.analyse{display:grid;gap:18px;align-items:start}
.analyse-lead{border-left:3px solid var(--accent)}
.analyse-sec{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.analyse-sec{grid-template-columns:1fr 1fr}}
@media(min-width:1200px){.analyse-sec{grid-template-columns:1fr 1fr 1fr}}
.analyse-more .tabbar{border-bottom:1px solid var(--rule)}

/* Werkzeuge: Import als Hauptjob */
.tools{display:grid;gap:18px;align-items:start}
.tools-lead{border-left:3px solid var(--accent)}
.tools-lead .pastewrap{padding-top:14px;padding-bottom:14px}
.tools-more .tabbar{border-bottom:1px solid var(--rule)}

/* ============ Wirkungsketten ============ */
.chainctl{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;
  border-bottom:1px solid var(--rule-soft);font-size:12px;color:var(--ink-soft)}
.chainctl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.chaingrid{display:grid;gap:12px;padding:14px 16px;grid-template-columns:1fr}
@media(min-width:820px){.chaingrid{grid-template-columns:1fr 1fr}}
@media(min-width:1400px){.chaingrid{grid-template-columns:1fr 1fr 1fr}}

.chn{border:1px solid var(--rule);background:var(--ground)}
.chn-hd{display:flex;gap:9px;align-items:center;padding:9px 11px;
  background:var(--raised);border-bottom:1px solid var(--rule)}
.chn-hd .nm{font-family:"JetBrains Mono",monospace;font-size:12.5px;
  font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.chn-hd .meta{font-size:9.5px;font-family:"JetBrains Mono",monospace;
  color:var(--ink-faint);white-space:nowrap}
.chn-body{padding:4px 0}
.lnk{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:5px 11px;
  font-size:12px;align-items:baseline}
.lnk>b{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.09em;
  color:var(--ink-faint);font-weight:700;padding-top:2px}
.lnk em{font-style:normal;color:var(--ink-soft)}
.pill{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;
  padding:2px 7px;margin:1px 3px 1px 0;border:1px solid var(--rule);
  background:var(--raised);white-space:nowrap;line-height:1.45}
.pill.live{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.pill.dead{border-color:var(--rule-soft);color:var(--ink-faint);opacity:.8}
.pill.take{cursor:pointer}
.pill.take:hover{border-color:var(--accent);color:var(--accent)}
.chn-foot{padding:6px 11px;border-top:1px solid var(--rule-soft);
  font-size:11px;color:var(--ink-faint);
  font-family:"JetBrains Mono",monospace}
.chn.orphan{border-color:var(--warn)}
.chn.orphan .chn-hd{background:var(--warn-soft)}

footer{padding:32px 0 60px;color:var(--ink-faint);font-size:13px;
  border-top:1px solid var(--rule);margin-top:28px;line-height:1.6}

/* --- Reiter --- */
.tabbar{display:flex;flex-wrap:wrap;background:var(--sunken);
  border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-right:1px solid var(--rule-soft);
  border-bottom:2px solid transparent;padding:9px 12px;font-size:11px;
  font-weight:700;letter-spacing:.02em;color:var(--ink-soft);cursor:pointer;
  display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink);background:var(--raised)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--raised)}
.tab .cnt{font-size:10px;font-weight:400;color:var(--ink-faint)}
.tab.on .cnt{color:var(--accent)}
.tabbar.big .tab{padding:12px 16px;font-size:12px}
.tabp{display:none}
.tabp.on{display:block}
.tabp>.headline:first-child,.tabp>.pathref:first-child{border-top:0}

/* --- Import als aufklappbares Panel --- */
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"−";font-family:"JetBrains Mono",monospace;
  color:var(--ink-faint);margin-left:8px}
details.panel:not([open])>summary::after{content:"+"}
details.panel:not([open])>summary{border-bottom:0}

/* --- Slots zweispaltig --- */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-soft)}
.twocol>div{background:var(--raised);min-width:0}
.subhd{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.04em;
  color:var(--ink-faint);padding:6px 10px 3px}
.twocol .slot{padding:4px 10px;font-size:12px}
.twocol .empty{padding:14px 10px;font-size:11.5px}

/* --- Skalierungsabzeichen im Katalog --- */
.bdgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bdg{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;
  padding:2px 6px;border:1px solid var(--rule);color:var(--ink-soft);
  white-space:nowrap;line-height:1.45;letter-spacing:.01em}
.bdg.w{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bdg.s{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.bdg.m{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.bdg.f,.bdg.d,.bdg.p{background:var(--sunken)}
.bdg.c{background:var(--sunken);border-style:dashed}
.bdg.r{background:var(--sunken);color:var(--accent);border-color:var(--accent)}
.bdg.g{background:var(--good-soft);color:var(--good);border-color:var(--good)}

/* --- Skalierungsreiter --- */
.scrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 14px;
  border-bottom:1px solid var(--rule-soft);font-size:12.5px;align-items:baseline}
.scrow .nm{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px}
.scrow .val{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--accent);white-space:nowrap}
.scrow .sub{grid-column:1/-1;color:var(--ink-soft);font-size:11.5px}
.scsum{padding:10px 14px;background:var(--accent-soft);border-bottom:1px solid var(--rule);
  font-size:12.5px}
/* kein uppercase: der Browser laesst Umlaute dabei klein stehen */
.scsum b{font-family:"JetBrains Mono",monospace;font-size:11.5px;display:block;
  letter-spacing:.02em;color:var(--accent);margin-bottom:4px}
/* kein uppercase: Chrome laesst dabei Umlaute klein stehen */
.schd{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  font-weight:700;color:var(--ink-faint);padding:9px 14px 4px;
  border-top:1px solid var(--rule-soft)}

.row.lock{opacity:.42}
.row.lock:hover{background:var(--warn-soft)}
.lvlbad{color:var(--warn);font-weight:700}
.qrow{display:grid;grid-template-columns:66px 1fr auto;gap:8px;align-items:center;
  padding:5px 14px;font-size:11px;font-family:"JetBrains Mono",monospace}
.qn{font-weight:700}
.qbar{height:7px;background:var(--sunken);border:1px solid var(--rule);display:block}
.qbar i{display:block;height:100%}
.qv{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.qv.over{color:var(--warn);font-weight:700}
.qhint{padding:9px 14px;font-size:11.5px;color:var(--ink-soft);
  border-bottom:1px solid var(--rule-soft);line-height:1.45}
.qhint a{color:var(--accent);font-weight:700;text-decoration:none}
.qhint a:hover{border-bottom:1px solid var(--accent)}
.qhint code{font-size:11px;background:var(--raised);border:1px solid var(--rule);
  padding:1px 5px}
.sug{display:flex;gap:9px;align-items:center;padding:7px 14px;cursor:pointer;
  border-bottom:1px solid var(--rule-soft)}
.sug:hover{background:var(--good-soft)}
.sugb{flex:1;min-width:0}
.sug .nm{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;display:block}
.sugwhy{font-size:11.5px;color:var(--ink-soft)}
.sugadd{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--good);
  font-size:15px;padding:0 3px}

.cmphd{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:10px 14px;
  background:var(--accent-soft);border-bottom:1px solid var(--rule);font-size:12.5px;
  font-family:"JetBrains Mono",monospace}
.cmphd .vs{color:var(--ink-faint);font-size:11px}
.cmpsplit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--rule-soft);
  border-bottom:1px solid var(--rule);font-size:11px;text-align:center;
  font-family:"JetBrains Mono",monospace}
.cmpsplit>span{background:var(--raised);padding:7px 4px}
.c-mine{color:var(--accent)} .c-his{color:var(--warn)} .c-both{color:var(--ink-faint)}
table.cmp{min-width:0}
table.cmp td.num{text-align:right}
table.cmp td.up{color:var(--good);font-weight:700}
table.cmp td.down{color:var(--warn);font-weight:700}
table.cmp tr.sep td{background:var(--sunken);font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.04em;color:var(--ink-faint)}
.cmprow{display:flex;align-items:center;gap:8px;padding:4px 14px;
  border-bottom:1px solid var(--rule-soft);font-size:12px}
.cmprow .nm{font-family:"JetBrains Mono",monospace;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmprow.add{cursor:pointer}
.cmprow.add:hover{background:var(--good-soft)}
.cmprow.locked{opacity:.55}
.cmprow.locked:hover{background:none;cursor:default}
.cmprow .stop{font-family:"JetBrains Mono",monospace;font-size:9.5px;
  color:var(--warn);border:1px solid var(--warn);padding:0 5px;white-space:nowrap}

.lg{font-weight:700}
.lg.up{color:var(--good)}
.lg.down{color:var(--warn)}
.archgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:1px;background:var(--rule-soft)}
.archb{background:var(--raised);border:0;padding:9px 10px;text-align:left;
  font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;
  color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;
  align-items:baseline;gap:6px}
.archb:hover{background:var(--accent-soft);color:var(--accent)}
.archb span{color:var(--ink-faint);font-weight:400;font-size:10px}
.offlink{padding:9px 14px;font-size:12px;border-top:1px solid var(--rule-soft)}
.offlink a{color:var(--accent)}

.aihint{margin:9px 0 0;font-size:11.5px;color:var(--ink-faint);line-height:1.45}

/* --- KI --- */
.aicfg{padding:10px 14px;border-bottom:1px solid var(--rule-soft);
  display:grid;gap:7px}
.aicfg label{display:grid;grid-template-columns:74px 1fr;gap:8px;
  align-items:center;font-size:11.5px;color:var(--ink-soft)}
.aicfg input,.aicfg select{background:var(--ground);color:var(--ink);
  border:1px solid var(--rule);padding:5px 8px;font-size:11.5px;
  font-family:"JetBrains Mono",monospace;min-width:0}
.aicfgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aistate{font-size:11px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace}
.aistate a{color:var(--accent)}
.aiwait{padding:14px;font-size:12.5px;color:var(--ink-faint);
  font-family:"JetBrains Mono",monospace}
.aiwarn{padding:11px 14px;background:var(--warn-soft);
  border-left:4px solid var(--warn);font-size:12.5px}
.aiwarn b{display:block;font-family:"JetBrains Mono",monospace;font-size:12px;
  margin-bottom:3px;color:var(--warn)}
.aiwarn a{color:var(--accent)}
.aitext{padding:12px 14px;font-size:13px;line-height:1.55}
.aitext h4{font-family:"JetBrains Mono",monospace;font-size:12px;
  color:var(--accent);margin:12px 0 5px}
.aitext ul{margin:6px 0;padding-left:20px}
.aitext li{margin:3px 0}
.aitext p{margin:0 0 8px}
.aitext code{font-family:"JetBrains Mono",monospace;font-size:11.5px;
  background:var(--sunken);padding:1px 4px}

/* --- Generator --- */
.genlist{display:grid;gap:1px;background:var(--rule-soft);
  border-bottom:1px solid var(--rule)}
.genb{background:var(--raised);border:0;padding:9px 14px;text-align:left;cursor:pointer}
.genb:hover{background:var(--accent-soft)}
.genb b{display:block;font-family:"JetBrains Mono",monospace;font-size:12px;
  color:var(--accent);margin-bottom:2px}
.genb span{font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.genwhy{font-size:10.5px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}

/* --- Stat-Prioritaet --- */
.statrow{display:grid;grid-template-columns:auto 108px 1fr 34px;gap:3px 8px;
  align-items:center;padding:6px 14px;border-bottom:1px solid var(--rule-soft)}
.statrow .rk{font-family:"JetBrains Mono",monospace;font-weight:700;
  color:var(--ink-faint);font-size:11px}
.statrow .sn{font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:700}
.sbar{height:8px;background:var(--sunken);border:1px solid var(--rule);display:block}
.sbar i{display:block;height:100%;background:var(--accent)}
.statrow .sp{font-family:"JetBrains Mono",monospace;font-size:11px;
  font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-soft)}
.swhy{grid-column:2/-1;font-size:11.5px;color:var(--ink-soft);line-height:1.4}

@media(max-width:900px){
  .views{margin-left:0;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch}
  .vtab{padding:12px 11px;flex:0 0 auto}
  .brand{flex:1 1 100%}
  .filtmore{flex:1 1 auto}
  .filtmore>summary{width:100%;text-align:center}
}
@media(max-width:560px){
  .twocol{grid-template-columns:1fr}
  .tbin{min-height:0;padding-top:10px;padding-bottom:0;gap:10px}
  .bmark{width:36px;height:36px;flex-basis:36px;font-size:12px}
  .btext b{font-size:17px}
  .tabbar.big .tab{padding:9px 11px;font-size:11px}
  .statgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .cmpsplit{grid-template-columns:1fr}
  .chip{font-size:10.5px}
}

.steps{padding:6px 14px 12px}
.steps ol{margin:0;padding-left:20px;font-size:13px}
.steps li{margin:7px 0}
.steps code{font-family:"JetBrains Mono",monospace;font-size:11.5px;
  background:var(--sunken);border:1px solid var(--rule);padding:1px 5px}
a.dl{display:inline-block;background:var(--accent);color:var(--accent-ink);
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
  padding:5px 11px;text-decoration:none;border:1px solid var(--accent)}
a.dl:hover{opacity:.88}

.pastewrap{padding:12px 14px;border-bottom:1px solid var(--rule-soft)}
.pastehint{margin:0 0 9px;font-size:12px;color:var(--ink-soft)}
.pastehint code,kbd{font-family:"JetBrains Mono",monospace;font-size:11px;
  background:var(--sunken);border:1px solid var(--rule);padding:1px 5px}
#pasteBox,#cmpBox{width:100%;background:var(--ground);color:var(--ink);
  border:1px solid var(--rule);font-family:"JetBrains Mono",monospace;
  font-size:11px;padding:8px;resize:vertical;line-height:1.45}
.pastebtns{display:flex;gap:8px;margin-top:9px}
.charhd{padding:10px 14px;background:var(--accent-soft);font-size:13px;
  border-bottom:1px solid var(--rule)}
.charhd b{font-family:"JetBrains Mono",monospace;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));
  gap:1px;background:var(--rule-soft);border-bottom:1px solid var(--rule)}
.statgrid>div{background:var(--raised);padding:6px 10px;display:flex;
  justify-content:space-between;align-items:baseline;gap:6px;font-size:12px}
.statgrid span{color:var(--ink-faint);font-size:11px}
.statgrid b{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.wepline{padding:7px 14px;font-size:12px;color:var(--ink-soft);
  border-bottom:1px solid var(--rule-soft)}
.wepline b{font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.04em;color:var(--ink-faint);
  margin-right:7px}
.band{font-family:"JetBrains Mono",monospace;font-size:10px;
  margin-left:6px;padding:1px 5px;border:1px solid var(--rule);
  color:var(--ink-faint);white-space:nowrap}
.band.low{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.band.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.band.high{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.band.unk{opacity:.75}
.ilvlnote{padding:8px 14px 10px;font-size:12px;color:var(--ink-soft);
  border-bottom:1px solid var(--rule-soft);line-height:1.45}
.ilvlnote b{font-family:"JetBrains Mono",monospace;font-size:11px;
  color:var(--ink)}
.wepline.meta{font-size:11px;color:var(--ink-faint)}
.gearwrap{padding:10px 14px 14px;border-bottom:1px solid var(--rule-soft)}
.geartitle{font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.1em;color:var(--ink-faint);
  margin-bottom:8px}
.gearpd{display:flex;flex-direction:column;gap:8px}
.gearcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gearcol{display:flex;flex-direction:column;gap:3px}
.gearbot{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.gslot{display:grid;grid-template-columns:72px 1fr auto;gap:6px;align-items:baseline;
  padding:5px 8px;background:var(--raised);border-left:3px solid var(--rule);
  font-size:12px}
.gslot.hasico{grid-template-columns:22px 72px 1fr auto;align-items:center}
.gslot.empty{opacity:.55}
.gico{width:18px;height:18px;flex:0 0 18px;background-size:cover;
  background-position:center;background-repeat:no-repeat;
  border-radius:2px;background-color:var(--sunken)}
.gico-miss{opacity:.35}
.gsl{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-faint);
  letter-spacing:.04em}
.gsn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsi{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-faint);
  white-space:nowrap}
.gid{margin-left:6px;opacity:.7}
.wcbox{padding:10px 14px 12px;border-bottom:1px solid var(--rule-soft);
  background:var(--sunken)}
.wcstatus{display:flex;flex-direction:column;gap:5px;margin:2px 0 8px;
  padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.wcrow{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;
  align-items:start;font-size:12px;line-height:1.45}
.wck{font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.04em;color:var(--ink-faint);padding-top:2px}
.wcv{color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.wcchip{display:inline-block;padding:1px 7px;border:1px solid var(--rule);
  background:var(--raised);font-size:11px;color:var(--ink-soft);
  white-space:nowrap}
.wcchip.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.wcchip.soft{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.scardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:6px;margin-top:8px}
.scard{padding:5px 8px;background:var(--raised);font-size:11px;
  display:flex;align-items:center;gap:8px;min-height:40px}
.scard.blocked{opacity:.55}
.scard.active{outline:1px solid var(--accent)}
.scico{flex:0 0 28px;width:28px;height:28px;display:inline-block;
  background-color:var(--ground);border:1px solid var(--rule)}
.scico-empty{background:repeating-linear-gradient(-45deg,transparent,transparent 3px,
  color-mix(in srgb,var(--rule) 55%,transparent) 3px,
  color-mix(in srgb,var(--rule) 55%,transparent) 6px)}
.scbody{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.scname{color:var(--ink);font-size:12px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scmeta{font-family:"JetBrains Mono",monospace;font-size:10px;
  color:var(--ink-faint);line-height:1.3}
.sctag{color:var(--ink-soft)}
.scid{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-faint)}
.wepline.muted{color:var(--ink-faint);font-size:11px}
table.stat.cmp tr.diff td{background:var(--accent-soft)}
.issue{padding:11px 16px;border-bottom:1px solid var(--rule-soft);font-size:13px;
  border-left:4px solid var(--rule);line-height:1.5}
.issue b{display:block;font-family:"JetBrains Mono",monospace;font-size:12px;
  margin-bottom:4px}
.issue.krit{background:var(--warn-soft);border-left-color:var(--warn)}
.issue.krit b{color:var(--warn)}
.issue.fix{background:var(--sunken);border-left-color:var(--ink-faint)}
.issue.ok{background:var(--good-soft);border-left-color:var(--good)}
.issue.ok b{color:var(--good)}

.pathpick{padding:13px 14px;border-bottom:1px solid var(--rule);background:var(--accent-soft)}
.pathname{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;color:var(--accent)}
.tagm{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--rule);padding:1px 5px;vertical-align:2px}
.pathpick p{margin:8px 0 0;font-size:13px}
.pathpick p.fit{color:var(--ink-soft);font-size:12px}
.pathpick p.warnline{color:var(--warn)}
.wpn{display:grid;gap:7px;margin-top:10px}
.wpn>div{font-size:12px;background:var(--raised);border-left:3px solid var(--accent);padding:6px 9px}
.wpn b{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.04em;color:var(--ink-faint);margin-bottom:2px}
.ranklist{display:block}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 9px;width:100%;
  text-align:left;padding:7px 14px;border:0;border-bottom:1px solid var(--rule-soft);
  background:none;align-items:baseline;font-size:12px}
.prow:hover{background:var(--sunken)}
.prow.on{background:var(--good-soft)}
.prow .rk{font-weight:700;color:var(--ink-faint)}
.prow .pn{font-weight:700;color:var(--ink)}
.prow .pw{color:var(--accent);font-size:11px}
.prow .pv{color:var(--ink-faint);font-size:11px;font-variant-numeric:tabular-nums}
.prow .pwhy{grid-column:2/-1;color:var(--ink-soft);font-family:"Source Serif 4",serif;
  font-size:12px;line-height:1.4}
.pnotes{padding:11px 14px 4px;border-top:1px solid var(--rule)}
.pnotes>b{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.04em;color:var(--ink-faint);margin-bottom:8px}
.pn-row{font-size:12.5px;padding:8px 10px;margin-bottom:7px;border-left:3px solid var(--rule)}
.pn-row.good{background:var(--good-soft);border-left-color:var(--good)}
.pn-row.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.pathref{display:grid;gap:12px;padding:14px}
@media(min-width:760px){.pathref{grid-template-columns:1fr 1fr}}
.pcard{border:1px solid var(--rule);padding:14px 15px;background:var(--raised);
  box-shadow:0 1px 0 var(--edge)}
.pcard h3{font-size:14px;color:var(--accent);margin-bottom:7px}
.pcard p{margin:0 0 8px;font-size:13px;color:var(--ink-soft);line-height:1.5}
.pcard .mult{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);padding:3px 7px;display:inline-block;
  margin-bottom:8px;border:1px solid var(--rule)}
.pcard dl{margin:0;font-size:12px}
.pcard dt{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.04em;
  color:var(--ink-faint);margin-top:6px}
.pcard dd{margin:1px 0 0}
